<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - BeMaker</title>
    <link rel="icon" type="image/x-icon" href="img/logo/LOGO BEMAKER-24.png" />

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <header class="header">
      <div class="header-logo">
        <a href="index.html">
          <img id="logo-image" src="img/logo/LOGO BEMAKER-16 copy.png" alt="logo BeMaker" />
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="index.html#services-section">Nuestros Servicios</a></li>
          <li><a href="index.html#about-us-section">Sobre Nosotros</a></li>
          <li><a href="index.html#ideas-section">Proyectos</a></li>
        </ul>
      </nav>
      <div>
        <button class="header-cta" style="background-color: var(--blue-primary); color: white; border: none;">Contacto</button>
        <button id="theme-switch" class="theme-switch-btn">🌙</button>
      </div>
    </header>

    <main class="main-contact">
      <section class="contact-form-section">
        <h2>Hablemos de tu idea</h2>
        <form action="https://formspree.io/f/mrbkvbaz" method="post" id="myContactForm">
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="tu.email@ejemplo.com" required />
            <small class="text-muted">Nunca compartiremos tu email con nadie más.</small>
          </div>
          <div class="form-group">
            <label for="asunto">Asunto:</label>
            <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required />
          </div>
          <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>
          <button type="submit" class="hero-cta cta-final-animated" style="width: 100%;">Enviar Mensaje</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <p>&copy; 2025 BeMaker. Todos los derechos reservados.</p>
        <div class="footer-social-media">
          <a href="https://www.linkedin.com/in/pilar-bonnault-mancilla" target="_blank"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://www.instagram.com/bemaker.dev" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://www.facebook.com/share/16bNj2comz/" target="_blank"><i class="fab fa-facebook-f"></i></a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
